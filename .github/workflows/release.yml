name: Immersive Railroading Release Pipeline

on: [workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        branch: [1.12.2-forge,
                 1.16.5-forge,
                 1.20.1-forge,
                 1.21.1-neoforge,
        ]
    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 25
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: keyscan
      run: mkdir -p ~/.ssh/ && ssh-keyscan -t rsa teamopenindustry.cc >> ~/.ssh/known_hosts
    - name: Install deps
      run: sudo apt install -y pngquant findutils xvfb
    - name: Setup Universal Mod Core (and helpers)
      env:
        BRANCH: ${{ matrix.branch }}
      run: java -jar UMCSetup.jar ${BRANCH} https
    - name: Gradle compile
      run: ./gradlew classes
    - name: Process images
      run: find src/main/resources/assets/immersiverailroading/ | grep png | xargs -I foo pngquant -s1 -f --ext .png foo
    - name: Gradle build
    - name: Gradle build
      run: ./gradlew build -Dtarget=release
    - name: Remove extra jars (keep only main jar)
      run: |
        rm -f build/libs/*-downgraded*.jar \
          build/libs/*-shadow*.jar \
          build/libs/*-sources*.jar || true
    - uses: actions/upload-artifact@v6
      with:
        name: Immersive Railroading ${{matrix.branch}}
        path: build/libs/ImmersiveRailroading-${{matrix.branch}}*.jar
